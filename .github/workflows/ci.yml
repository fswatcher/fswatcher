name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
      - run: go vet ./...
      - run: go test -race ./...

  test-freebsd:
    name: test (freebsd)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        with:
          usesh: true
          prepare: |
            pkg install -y go
          run: |
            go vet ./...
            go test -race ./...

  test-openbsd:
    name: test (openbsd)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Test on OpenBSD
        uses: vmactions/openbsd-vm@18edb32f4e48dae5865d7b8b3a9587bc01218a20 # v1.4.4
        with:
          usesh: true
          prepare: |
            pkg_add go
            go version
          run: |
            go vet ./...
            go test ./... # -race is not supported on openbsd/amd64

  test-netbsd:
    name: test (netbsd)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: vmactions/netbsd-vm@1d9767765fd3f986e6de3aff4b1148f0c3a45f01 # v1.4.1
        with:
          usesh: true
          prepare: |
            # pkgsrc has no stable plain "go" package on this image, so fetch
            # the official toolchain for netbsd/amd64 instead.
            ver="$(ftp -o - "https://go.dev/VERSION?m=text" | head -n1)"
            ftp -o go.tar.gz "https://go.dev/dl/${ver}.netbsd-amd64.tar.gz"
            mkdir -p /usr/local
            tar -C /usr/local -xzf go.tar.gz
          run: |
            /usr/local/go/bin/go version
            /usr/local/go/bin/go vet ./...
            /usr/local/go/bin/go test -race ./...
