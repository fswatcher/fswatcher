name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'
      - run: go vet ./...
      - run: go test -race ./...

  test-freebsd:
    name: test (freebsd)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          usesh: true
          prepare: |
            pkg install -y go
          run: |
            go vet ./...
            go test -race ./...

  test-openbsd:
    name: test (openbsd)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test on OpenBSD
        uses: vmactions/openbsd-vm@v1.4.9
        with:
          usesh: true
          prepare: |
            pkg_add go
            go version
          run: |
            go vet ./...
            go test ./... # -race is not supported on openbsd/amd64

  test-netbsd:
    name: test (netbsd)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/netbsd-vm@v1.5.2
        with:
          usesh: true
          prepare: |
            # pkgsrc has no stable plain "go" package on this image, so fetch
            # the official toolchain for netbsd/amd64 instead.
            ver="$(ftp -o - "https://go.dev/VERSION?m=text" | head -n1)"
            ftp -o go.tar.gz "https://go.dev/dl/${ver}.netbsd-amd64.tar.gz"
            mkdir -p /usr/local
            tar -C /usr/local -xzf go.tar.gz
          run: |
            /usr/local/go/bin/go version
            /usr/local/go/bin/go vet ./...
            /usr/local/go/bin/go test -race ./...
